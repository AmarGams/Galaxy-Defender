name: Build Galaxy Defender APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Galaxy Defender
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.34

      - name: Clean old Android files
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Check Galaxy Defender
        run: |
          echo "Checking game files..."
          test -f main.py
          echo "main.py FOUND!"
          ls -lh main.py

      - name: Create Buildozer spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]

          title = Galaxy Defender
          package.name = galaxydefender
          package.domain = com.amargams

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,mp3,wav,txt

          version = 1.0

          requirements = python3,pygame

          orientation = landscape
          fullscreen = 1

          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a

          [buildozer]

          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build Galaxy Defender Release APK
        run: |
          buildozer -v android release

      - name: Show APK
        run: |
          echo "===== APK FILES ====="
          ls -lh bin/

      - name: Upload Galaxy Defender APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-Release-APK
          path: bin/*.apk
          if-no-files-found: error
