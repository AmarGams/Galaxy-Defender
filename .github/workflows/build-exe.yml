name: Build Galaxy Defender EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Find game file
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter "galaxy_defender.py" | Select-Object FullName

      - name: Build EXE
        shell: pwsh
        run: |
          $game = Get-ChildItem -Path . -Recurse -Filter "galaxy_defender.py" | Select-Object -First 1
          pyinstaller --onefile --windowed --name "Galaxy Defender" "$($game.FullName)"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-Windows
          path: dist/Galaxy Defender.exe
