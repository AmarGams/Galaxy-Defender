name: Build Galaxy Defender APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Galaxy Defender
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.34

      - name: Check game
        run: |
          if [ ! -f main.py ]; then
            echo "ERROR: main.py is missing!"
            exit 1
          fi

          echo "main.py found!"
          ls -lh main.py

      - name: Create Buildozer spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Galaxy Defender
          package.name = galaxydefender
          package.domain = com.amargams
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,mp3,wav,txt
          version = 1.0
          requirements = python3,pygame
          orientation = landscape
          fullscreen = 1
          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log
          BUILD_RESULT=${PIPESTATUS[0]}

          echo ""
          echo "======================================"
          echo "        BUILD FINISHED"
          echo "======================================"

          echo ""
          echo "Searching automatically for AIDL..."

          find "$HOME/.buildozer" -type f -name "aidl" -print 2>/dev/null || true

          echo ""
          echo "Last errors from Buildozer:"
          grep -i -E "aidl|error|failed|exception|fatal" build.log | tail -80 || true

          exit $BUILD_RESULT

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-APK
          path: bin/*.apk
          if-no-files-found: error
