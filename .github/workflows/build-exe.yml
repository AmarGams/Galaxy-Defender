name: Build Galaxy Defender EXE - Windows 7

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"

      - name: Install compatible packages
        run: |
          python -m pip install --upgrade pip
          pip install pygame==2.1.3
          pip install pyinstaller==5.13.2

      - name: Find Galaxy Defender
        shell: pwsh
        run: |
          $game = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter "galaxy_defender.py" | Select-Object -First 1

          if ($null -eq $game) {
            Write-Error "galaxy_defender.py was NOT found!"
            exit 1
          }

          Write-Host "FOUND: $($game.FullName)"
          "GAME_FILE=$($game.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows 7 EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name "Galaxy Defender" "$env:GAME_FILE"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-Windows-7
          path: "dist/Galaxy Defender.exe"
