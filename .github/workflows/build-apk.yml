name: Build Galaxy Defender APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download game files
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            gettext autopoint curl

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Create Python environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython==0.29.34"
          pip install buildozer

      - name: Prepare Android entry file
        run: |
          cp "galaxy_defender .py" main.py

      - name: Create Buildozer configuration
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Galaxy Defender
          package.name = galaxydefender
          package.domain = com.amargams
          version = 1.0

          source.dir = .
          source.include_exts = py,mp3,ogg,wav,png,jpg,jpeg
          requirements = python3,pygame

          orientation = landscape
          fullscreen = 1

          android.api = 35
          android.minapi = 23
          android.accept_sdk_license = True

          p4a.branch = master

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK
        run: |
          . .venv/bin/activate
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-APK
          path: bin/*.apk
          if-no-files-found: error
