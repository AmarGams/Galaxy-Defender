name: Build Galaxy Defender APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.34

      - name: Check main.py
        run: |
          if [ ! -f main.py ]; then
            echo "ERROR: main.py was not found!"
            exit 1
          fi
          echo "main.py found successfully!"

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Galaxy Defender
          package.name = galaxydefender
          package.domain = com.amargs
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,mp3,wav,txt
          version = 1.0
          requirements = python3,pygame
          orientation = landscape
          fullscreen = 1

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-APK
          path: bin/*.apk
