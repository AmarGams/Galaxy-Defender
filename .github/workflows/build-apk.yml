name: Build Galaxy Defender APK - P4A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get Galaxy Defender
        uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget \
            openjdk-17-jdk \
            python3 python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            cmake libffi-dev libssl-dev \
            zlib1g-dev libncurses5-dev \
            gettext autopoint

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Python-for-Android
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install python-for-android

      - name: Prepare game
        run: |
          cp "galaxy_defender .py" main.py

      - name: Build APK
        run: |
          . .venv/bin/activate
          p4a apk \
            --private . \
            --package=com.amargams.galaxydefender \
            --name "Galaxy Defender" \
            --version 1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,pygame \
            --arch=arm64-v8a \
            --android-api=35 \
            --orientation=landscape \
            --fullscreen

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-APK
          path: "**/*.apk"
          if-no-files-found: error
