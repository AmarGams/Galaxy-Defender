name: Build Galaxy Defender EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Show repository files
        shell: pwsh
        run: |
          Write-Host "===== REPOSITORY FILES ====="
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Find Galaxy Defender
        shell: pwsh
        run: |
          $game = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter "galaxy_defender.py" | Select-Object -First 1

          if ($null -eq $game) {
            Write-Error "galaxy_defender.py was NOT found in the downloaded repository."
            exit 1
          }

          Write-Host "FOUND GAME:"
          Write-Host $game.FullName

          "GAME_FILE=$($game.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Galaxy Defender
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name "Galaxy Defender" "$env:GAME_FILE"

      - name: Upload Galaxy Defender EXE
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-Windows
          path: "dist/Galaxy Defender.exe"
