name: Build Galaxy Defender APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Galaxy Defender
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.34

      - name: Check game
        run: |
          test -f main.py
          echo "main.py found!"
          ls -lh main.py

      - name: Install Android command line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"

          cd /tmp

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q commandlinetools-linux-11076708_latest.zip

          mv cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"

          echo "Android SDK installed."

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: |
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Verify AIDL
        run: |
          echo "Searching for AIDL..."

          find "$HOME/android-sdk" -type f -name aidl -print

          AIDL=$(find "$HOME/android-sdk" -type f -name aidl | head -1)

          if [ -z "$AIDL" ]; then
            echo "AIDL was NOT installed!"
            exit 1
          fi

          echo "AIDL FOUND:"
          "$AIDL" --version

      - name: Create Buildozer spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Galaxy Defender
          package.name = galaxydefender
          package.domain = com.amargams
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,mp3,wav,txt
          version = 1.0
          requirements = python3,pygame
          orientation = landscape
          fullscreen = 1

          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build Galaxy Defender
        run: |
          buildozer -v android debug

      - name: Show APK
        if: success()
        run: |
          echo "=============================="
          echo "APK BUILD SUCCESSFUL!"
          echo "=============================="
          ls -lh bin/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-APK
          path: bin/*.apk
          if-no-files-found: error
