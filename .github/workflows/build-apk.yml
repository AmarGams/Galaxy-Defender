name: Build Galaxy Defender APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download game files
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            automake autopoint gettext

      - name: Create Python environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install buildozer cython==0.29.34

      - name: Prepare Android entry file
        run: |
          cp "galaxy_defender .py" main.py

      - name: Create Buildozer configuration
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Galaxy Defender
          package.name = galaxydefender
          version = 1.0
          package.domain = com.amargams
          source.dir = .
          source.include_exts = py,mp3
          requirements = python3,pygame==2.6.1
          orientation = landscape
          fullscreen = 1
          android.api = 35
          android.minapi = 23
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK
        run: |
          . .venv/bin/activate
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-APK
          path: bin/*.apk
